name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run: no point spending
# minutes on a commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit rather than by tag. A tag can be moved to point
# at different code; a commit cannot. Dependabot raises the pull requests that
# bump them, so pinning does not mean going stale.
permissions:
  contents: read

jobs:
  checks:
    name: lint and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the secrets scan below reads all of it on main,
          # and needs the commit a pull request starts from.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # The same hooks as on a developer machine, from the same file. A check
      # that only runs in CI is a check nobody can reproduce before pushing.
      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure --color always

      # The gitleaks hook reads what is staged, which is right before a commit
      # and empty on a CI checkout: there it passes whatever the branch holds.
      # This step reads the commits instead, those of the pull request or the
      # whole history of main, so a secret added then deleted is still caught.
      # The same gitleaks as the hook, checked against the checksum of its
      # release.
      - name: Scan the commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # From the base to the head: a run cancelled by a newer push loses
            # nothing, since the next one reads the same commits and more.
            range="$PR_BASE..$PR_HEAD"
          else
            # On main, everything the pushed commit reaches, not just what the
            # push brought. Merges in quick succession cancel each other's
            # runs (see concurrency above; without cancel-in-progress, GitHub
            # would still keep only the latest pending run), so a scan per
            # push leaves the commits of the cancelled runs unscanned. This
            # way, any run that passes vouches for the whole branch, in under
            # a second at this size.
            range="$GITHUB_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$range"

  site:
    name: build, links and Lighthouse
    runs-on: ubuntu-latest
    # The whole job takes a few minutes. A step that hangs fails it here
    # rather than holding the pull request for the six hours GitHub allows.
    timeout-minutes: 30
    env:
      # The tag of the Playwright image the browser checks run in, and the
      # version of the playwright package installed there to match it.
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Every link to another site opens in a new tab, so that the site stays
      # open behind it, and says so to screen readers. Read from the build.
      - name: Links to other sites, in a new tab
        run: node scripts/check-new-tab.mjs dist

      # What search engines read: robots.txt and the sitemap it names, every
      # indexable page in it with both languages, its title, description and
      # canonical address, and structured data that parses and has no key
      # that would name an employer (worksFor, affiliation, employee,
      # memberOf). Read from the build.
      - name: Sitemap, metadata and structured data
        run: node scripts/check-seo.mjs dist

      # The built site, served at the root as on the domain, for the two
      # checks below. It keeps running until the job ends.
      - name: Serve the build
        run: |
          npm run preview -- --port 4321 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:4321/ && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1

      # The CV, one PDF per language, printed from the experience page by the
      # runner's Chrome into the served build, as the deployment does, so that
      # the dead-link check below finds the files the pages link to. Three A4
      # pages at most, or the step fails.
      - name: CV as a PDF
        run: node scripts/cv-pdf.mjs http://localhost:4321/ dist

      # Links within a page (#contact) must land on an element that exists.
      # Two kinds of links are skipped. The canonical and language links point
      # at the published site, which shows the previous version until this one
      # is merged: the pages they name are the ones crawled here. And LinkedIn
      # answers every client that is not a browser with HTTP 999, so a check
      # from CI can only fail there.
      - name: Dead links
        run: >-
          npx linkinator http://localhost:4321/ --recurse --retry --verbosity error
          --check-fragments
          --skip '^https://oguandalini\.com/'
          --skip '^https://www\.linkedin\.com/'

      # The guided tour, used as a reader uses it, in the runner's Chrome:
      # clicks on its buttons and chapters, the end of the page, and on a
      # phone, each step's drawing framed whole, no word of it under 8 px.
      - name: Guided tour, clicked through
        run: node scripts/check-tour.mjs http://localhost:4321/

      # The tool cards, used as a reader uses them, in Chrome and in WebKit,
      # the engine of Safari: a click or a tap opens the right card inside the
      # screen, at the bottom of a phone's and no taller than its words, and
      # it closes again. Safari once stretched it over a phone's screen, which
      # Chrome could not show. The two browsers come from Playwright's own
      # image, which ships them with every library they need, in the version
      # of Playwright it is tagged with. Installing those libraries on the
      # runner went through the Ubuntu mirror, which once stopped answering
      # and left this step hanging. The image reaches the server the build
      # runs on through the runner's network.
      - name: Tool cards, in Chrome and in WebKit
        run: >-
          docker run --rm --network host -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/app" -w /app "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
          sh -c "npm install --no-save playwright@${PLAYWRIGHT_VERSION}
          && node scripts/check-cards.mjs http://localhost:4321/"

      # The solved problems of the Experience page, in the same two browsers:
      # folded on a phone, each unfolded and folded again by a tap; every
      # story beside its title on a wide screen, as before, and on paper.
      - name: Solved problems, in Chrome and in WebKit
        run: >-
          docker run --rm --network host -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/app" -w /app "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
          node scripts/check-experience.mjs http://localhost:4321/

      # The entrance of the home page, in the same two browsers, on six
      # screen sizes: it plays once per visit, for a visitor who lands on the
      # page, never with less motion, held on its first frame while it waits;
      # it moves nothing in the layout, leaves no link fully transparent nor
      # a press on one to the plate or the page under it, and nothing past
      # the sides of the screen, and ends at rest on its own timers, flat,
      # each figure at the value of the HTML, even with its animations frozen
      # or fonts that never come.
      # --ipc=host gives the browsers the shared memory Playwright asks for
      # in a container: this check composites a 3D scene of frosted tiles,
      # and every run that validated it had it.
      - name: Entrance of the home page, in Chrome and in WebKit
        run: >-
          docker run --rm --network host --ipc=host -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/app" -w /app "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
          node scripts/check-motion.mjs http://localhost:4321/

      # Performance, accessibility, best practices and SEO: 90 or more on
      # each, in both languages, or the pull request fails.
      - name: Lighthouse
        run: npx lhci autorun

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
