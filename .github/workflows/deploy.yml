name: deploy

# Every merge to main goes live. GitHub Pages authenticates the deployment with
# a short-lived OIDC token issued for this run: no key or token is stored.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The CV, one PDF per language, printed from the experience page of the
      # build by the runner's Chrome, into the build: the build is served for
      # the time it takes. Three A4 pages at most, or nothing is published.
      - name: CV as a PDF
        run: |
          npm run preview -- --port 4321 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:4321/ && break
            sleep 1
          done
          node scripts/cv-pdf.mjs http://localhost:4321/ dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish, and only through the Pages environment.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
